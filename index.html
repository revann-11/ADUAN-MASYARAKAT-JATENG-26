<!DOCTYPE html>
<html>
<head>
    <title>Aduan Masyarakat Jawa Tengah</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #1e1e1e;
            color: white;
        }

        header {
            text-align: center;
            background: #111;
            padding: 15px;
        }

        .logo {
            width: 90px;
        }

        .logo-bg {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 280px;
            transform: translate(-50%, -50%);
            opacity: 0.08;
            z-index: -1;
        }

        .container {
            display: none;
            justify-content: center;
            align-items: center;
            height: calc(100vh - 120px);
        }

        .form-box {
            background: rgba(0,0,0,0.7);
            padding: 25px;
            width: 350px;
            border-radius: 15px;
        }

        input, textarea, select {
            width: 100%;
            margin: 6px 0;
            padding: 10px;
            border-radius: 8px;
            border: none;
        }

        button {
            width: 100%;
            padding: 10px;
            background: orange;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: darkorange;
        }

        #preview {
            width: 100%;
            margin-top: 10px;
            display: none;
            border-radius: 10px;
        }

        #authBox {
            text-align: center;
            margin-top: 30px;
        }
    </style>
</head>

<body>

<header>
    <img src="logo.png" class="logo">
    <h1>Aduan Masyarakat Jawa Tengah</h1>
</header>

<img src="logo.png" class="logo-bg">

<!-- LOGIN SEDERHANA -->
<div id="authBox">
    <h2>Login Sederhana</h2>
    <input type="text" id="username" placeholder="Username"><br><br>
    <input type="password" id="password" placeholder="Password"><br><br>
    <button onclick="login()">Login</button>
</div>

<!-- FORM -->
<div class="container">
<div class="form-box">

<h2>FORM ADUAN</h2>

<form id="formAduan">

<input type="text" id="nama" placeholder="Nama" required>

<select id="kabupaten" required>
<option>Loading...</option>
</select>

<select id="kecamatan" required>
<option>Pilih Kecamatan</option>
</select>

<input type="text" id="alamat" placeholder="Alamat" required>

<textarea id="masalah" placeholder="Masalah" required></textarea>

<!-- WAKTU KEJADIAN -->
<input type="datetime-local" id="waktu" required>

<input type="file" id="foto" accept="image/*">
<img id="preview">

<button type="submit">Kirim Aduan</button>

</form>

<div id="successMsg" style="display:none; text-align:center;">
<h3 style="color:lightgreen;">✅ Berhasil</h3>
<p>Aduan anda sudah kami terima, kami akan mengirimkan petugas terkait.</p>
</div>

</div>
</div>

<script>

// LOGIN SEDERHANA (tanpa database)
function login(){
    let user = document.getElementById("username").value;
    let pass = document.getElementById("password").value;

    if(user === "admin" && pass === "123"){
        document.getElementById("authBox").style.display = "none";
        document.querySelector(".container").style.display = "flex";
    } else {
        alert("Username / Password salah!");
    }
}

// ================= API KABUPATEN =================
fetch("https://www.emsifa.com/api-wilayah-indonesia/api/regencies/33.json")
.then(res => res.json())
.then(data => {
    data.sort((a, b) => a.name.localeCompare(b.name));

    let kab = document.getElementById("kabupaten");
    kab.innerHTML = "<option>Pilih Kabupaten</option>";

    data.forEach(k => {
        let opt = document.createElement("option");
        opt.value = k.id;
        opt.textContent = k.name;
        kab.appendChild(opt);
    });
});

// ================= API KECAMATAN =================
document.getElementById("kabupaten").addEventListener("change", function(){
    let id = this.value;

    fetch(`https://www.emsifa.com/api-wilayah-indonesia/api/districts/${id}.json`)
    .then(res => res.json())
    .then(data => {
        data.sort((a, b) => a.name.localeCompare(b.name));

        let kec = document.getElementById("kecamatan");
        kec.innerHTML = "<option>Pilih Kecamatan</option>";

        data.forEach(d => {
            let opt = document.createElement("option");
            opt.textContent = d.name;
            kec.appendChild(opt);
        });
    });
});

// PREVIEW FOTO
document.getElementById("foto").addEventListener("change", function(e){
    let file = e.target.files[0];
    let preview = document.getElementById("preview");

    if(file){
        preview.src = URL.createObjectURL(file);
        preview.style.display = "block";
    }
});

// AUTO ISI WAKTU SEKARANG
document.getElementById("waktu").value =
new Date().toISOString().slice(0,16);

// SUBMIT
document.getElementById("formAduan").addEventListener("submit", function(e){
    e.preventDefault();

    document.getElementById("formAduan").style.display="none";
    document.getElementById("successMsg").style.display="block";
});

</script>

</body>
</html>
